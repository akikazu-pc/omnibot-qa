name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行测试
        run: node --test "tests/**/*.test.js"

      - name: 演示流程（验证 CLI 可用）
        run: |
          node cli.js demo
          node cli.js stats
